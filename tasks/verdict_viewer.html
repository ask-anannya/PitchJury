<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Verdicts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#0C1525;font-family:"EB Garamond",Georgia,serif;color:#F5F0E6}

:root{
  --navy:#0C1525;--navy-mid:#152035;--navy-lt:#1E3050;--navy-card:#1A2C47;
  --gold:#C9A84C;--gold-lt:#E8C97A;--gold-dim:rgba(201,168,76,0.18);
  --cream:#F5F0E6;--slate:#8899AA;--slate-lt:#AABBCC;
  --green:#16A34A;--amber:#D97706;--red:#DC2626;
}

/* ── LAYOUT ─────────────────────────────────────────────────── */
.page{max-width:900px;margin:0 auto;padding:48px 24px 80px}

/* ── HEADER ─────────────────────────────────────────────────── */
.page-header{text-align:center;margin-bottom:48px}
.page-eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.page-title{font-family:"Playfair Display",serif;font-size:clamp(28px,4vw,42px);font-weight:900;color:var(--cream);line-height:1.1;margin-bottom:8px}
.page-title em{font-style:italic;color:var(--gold-lt)}
.page-sub{font-size:15px;color:var(--slate);font-style:italic}

/* ── PERSONA TABS ───────────────────────────────────────────── */
.tabs-row{
  display:flex;gap:10px;margin-bottom:32px;
  overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;
}
.tabs-row::-webkit-scrollbar{display:none}

.tab{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 14px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(201,168,76,0.12);background:var(--navy-mid);
  transition:all .2s ease;min-width:110px;
}
.tab:hover{border-color:rgba(201,168,76,0.35);background:var(--navy-lt)}
.tab.active{
  border-color:var(--gold);background:var(--navy-lt);
  box-shadow:0 0 0 1px rgba(201,168,76,0.2),0 4px 20px rgba(0,0,0,0.3);
}
.tab-avatar{
  width:48px;height:56px;position:relative;
  background:#000;border-radius:6px;overflow:hidden;
}
.tab-avatar img{width:100%;height:100%;object-fit:contain;object-position:bottom center}
.tab-name{font-size:10px;font-weight:600;color:var(--cream);text-align:center;line-height:1.2;letter-spacing:.02em}
.tab-score{
  font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Playfair Display",serif;
}
.tab-progress{
  height:2px;width:100%;background:rgba(201,168,76,0.12);border-radius:1px;margin-top:2px;
}
.tab-progress-fill{height:100%;border-radius:1px;background:var(--gold);transition:width .3s ease}

/* ── VERDICT PANEL ──────────────────────────────────────────── */
.verdict-panel{
  background:var(--navy-mid);border:1px solid var(--gold-dim);
  border-radius:14px;overflow:hidden;
  animation:panelIn .35s cubic-bezier(0.2,0.8,0.3,1);
}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* persona hero */
.persona-hero{
  display:flex;align-items:flex-end;gap:0;
  background:linear-gradient(135deg,var(--navy-lt) 0%,var(--navy) 100%);
  border-bottom:1px solid var(--gold-dim);padding:0;min-height:200px;
  position:relative;overflow:hidden;
}
.persona-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 50% 80% at 15% 100%,rgba(201,168,76,0.06) 0%,transparent 70%);
}

.hero-img-wrap{
  width:180px;flex-shrink:0;height:200px;position:relative;
  background:#000;
}
.hero-img-wrap img{
  width:100%;height:100%;object-fit:contain;object-position:bottom center;
  display:block;
}
.hero-img-wrap::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:60px;
  background:linear-gradient(90deg,transparent,var(--navy-lt));
}

.hero-content{flex:1;padding:28px 28px 28px 20px;position:relative;z-index:1}
.hero-name{font-family:"Playfair Display",serif;font-size:26px;font-weight:900;color:var(--cream);margin-bottom:4px}
.hero-role{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}

.score-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.score-big{
  font-family:"Playfair Display",serif;font-size:52px;font-weight:900;line-height:1;
}
.score-label{font-size:20px;color:var(--slate)}
.score-bar-wrap{flex:1;max-width:200px}
.score-bar-track{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-bottom:4px}
.score-bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(0.4,0,0.2,1)}
.score-rationale{font-size:13px;color:var(--slate-lt);font-style:italic;line-height:1.5}

.verdict-text{
  font-size:16px;line-height:1.7;color:var(--cream);font-style:italic;
  border-left:2px solid var(--gold-dim);padding-left:14px;margin-top:12px;
}

/* body sections */
.panel-body{padding:28px}

.section-block{margin-bottom:28px}
.section-block:last-child{margin-bottom:0}

.section-title{
  font-size:9px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,0.2),transparent)}

/* sharpest objection */
.objection-box{
  background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.2);
  border-radius:8px;padding:16px 18px;margin-bottom:14px;
}
.objection-quote{
  font-size:14px;font-style:italic;color:var(--slate-lt);
  border-left:2px solid rgba(220,38,38,0.4);padding-left:12px;
  margin-bottom:12px;line-height:1.6;
}
.objection-text{font-size:14px;color:var(--cream);line-height:1.65}

/* section breakdown */
.breakdown-items{display:flex;flex-direction:column;gap:12px}
.breakdown-item{
  background:var(--navy-card);border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;padding:14px 16px;
}
.breakdown-section-name{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--gold);margin-bottom:8px;
}
.breakdown-quote{
  font-size:12.5px;font-style:italic;color:var(--slate);
  border-left:2px solid var(--gold-dim);padding-left:10px;
  margin-bottom:8px;line-height:1.5;
}
.breakdown-critique{font-size:13.5px;color:var(--cream);line-height:1.65}

/* what would change my mind */
.wtcmm-box{
  background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);
  border-radius:8px;padding:16px 18px;
}
.wtcmm-text{font-size:14px;color:var(--cream);line-height:1.65;font-style:italic}

/* ── NAVIGATION ─────────────────────────────────────────────── */
.nav-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:24px;
}
.nav-btn{
  display:flex;align-items:center;gap:8px;
  background:transparent;border:1px solid rgba(201,168,76,0.25);
  border-radius:6px;padding:10px 20px;cursor:pointer;
  font-family:"EB Garamond",serif;font-size:14px;
  color:var(--gold);letter-spacing:.08em;
  transition:all .2s ease;
}
.nav-btn:hover{background:rgba(201,168,76,0.08);border-color:var(--gold)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.primary{
  background:var(--gold);color:var(--navy);border-color:var(--gold);
  font-weight:600;
}
.nav-btn.primary:hover{background:var(--gold-lt);border-color:var(--gold-lt)}

.nav-counter{font-size:12px;color:var(--slate);letter-spacing:.1em}

/* ── ENTER THE ROOM ─────────────────────────────────────────── */
.enter-room-wrap{
  margin-top:32px;padding:32px;
  background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(201,168,76,0.03));
  border:1px solid rgba(201,168,76,0.3);border-radius:14px;text-align:center;
}
.enter-room-label{
  font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);
  margin-bottom:12px;
}
.enter-room-title{
  font-family:"Playfair Display",serif;font-size:24px;font-weight:700;
  color:var(--cream);margin-bottom:8px;
}
.enter-room-sub{font-size:14px;color:var(--slate);font-style:italic;margin-bottom:24px}
.enter-room-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--gold);color:var(--navy);border:none;border-radius:8px;
  padding:14px 40px;cursor:pointer;font-family:"Playfair Display",serif;
  font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  transition:all .2s ease;animation:btnPulse 2.5s ease-in-out infinite;
}
.enter-room-btn:hover{background:var(--gold-lt);transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,168,76,0.3)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.4)}50%{box-shadow:0 0 0 8px rgba(201,168,76,0)}}

/* ── SCORE COLOURS ──────────────────────────────────────────── */
.score-green{color:#4ADE80}
.score-amber{color:#FBBF24}
.score-red{color:#F87171}
.bar-green{background:#16A34A}
.bar-amber{background:#D97706}
.bar-red{background:#DC2626}
</style>
</head>
<body>
<div class="page">

  <div class="page-header">
    <div class="page-eyebrow">Focus Group Results</div>
    <div class="page-title">The Panel's <em>Verdicts</em></div>
    <div class="page-sub">Read each reviewer's full assessment before entering the room</div>
  </div>

  <!-- TABS -->
  <div class="tabs-row" id="tabs-row"></div>

  <!-- VERDICT PANEL -->
  <div class="verdict-panel" id="verdict-panel"></div>

  <!-- NAV -->
  <div class="nav-row" id="nav-row"></div>

  <!-- ENTER THE ROOM (hidden until last persona) -->
  <div class="enter-room-wrap" id="enter-room-wrap" style="display:none">
    <div class="enter-room-label">You have heard all five verdicts</div>
    <div class="enter-room-title">Are you ready to defend yourself?</div>

    <button class="enter-room-btn" onclick="enterRoom()">
      Enter the Room &rarr;
    </button>
  </div>

</div>

. What do you know about contract review that Kira, Luminance, and every other legal AI company doesn't?"}, "section_breakdown": [{"section": "Solution", "quote": "Accuracy: 94.3% on clause identification vs. senior associate benchmark", "critique": "94.3% accuracy is actually a concerning number for a legal product, not a reassuring one. If I'm reviewing a $5M acquisition agreement, a 5.7% error rate could be catastrophic. How do you handle the cases the model gets wrong? What is the human-in-the-loop mechanism? This needs a much more nuanced framing."}, {"section": "Competition", "quote": "Built SMB-first — no legacy enterprise bloat", "critique": "The positioning against Kira and Luminance is valid. But you're not just competing with them — you're competing with every founder's associate who does this manually and every general AI tool that can be prompted to review contracts. What makes Veritas AI the default choice rather than 'the legal module in the tool we already use'?"}], "what_would_change_my_mind": "Tell me one thing about the contract review market that surprised you during customer discovery. Something that changed how you think about the problem. That insight is what I'm investing in, not the product.", "img": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0d let current = 0;

function scoreColor(s) {
  if (s >= 7.5) return 'score-green';
  if (s >= 5) return 'score-amber';
  return 'score-red';
}
function barClass(s) {
  if (s >= 7.5) return 'bar-green';
  if (s >= 5) return 'bar-amber';
  return 'bar-red';
}

function buildTabs() {
  const row = document.getElementById('tabs-row');
  row.innerHTML = '';
  PERSONAS.forEach((p, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === current ? ' active' : '');
    tab.innerHTML = `
      <div class="tab-avatar"><img src="${p.img}" alt="${p.name}" /></div>
      <div class="tab-name">${p.name}</div>
      <div class="tab-score ${scoreColor(p.score)}" style="background:rgba(0,0,0,0.3)">${p.score}</div>
      <div class="tab-progress"><div class="tab-progress-fill" style="width:${i < current ? '100%' : i === current ? '50%' : '0%'}"></div></div>
    `;
    tab.onclick = () => goTo(i);
    row.appendChild(tab);
  });
}

function buildVerdict(idx) {
  const p = PERSONAS[idx];
  const panel = document.getElementById('verdict-panel');

  const breakdown = p.section_breakdown.map(s => `
    <div class="breakdown-item">
      <div class="breakdown-section-name">${s.section}</div>
      <div class="breakdown-quote">"${s.quote}"</div>
      <div class="breakdown-critique">${s.critique}</div>
    </div>
  `).join('');

  panel.innerHTML = `
    <div class="persona-hero">
      <div class="hero-img-wrap">
        <img src="${p.img}" alt="${p.name}" />
      </div>
      <div class="hero-content">
        <div class="hero-name">${p.name}</div>
        <div class="hero-role">${p.role}</div>
        <div class="score-row">
          <div class="score-big ${scoreColor(p.score)}">${p.score}</div>
          <div class="score-label">/10</div>
          <div class="score-bar-wrap">
            <div class="score-bar-track">
              <div class="score-bar-fill ${barClass(p.score)}" style="width:${p.score * 10}%"></div>
            </div>
            <div style="font-size:11px;color:var(--slate)">${p.score_rationale}</div>
          </div>
        </div>
        <div class="verdict-text">"${p.verdict}"</div>
      </div>
    </div>
    <div class="panel-body">
      <div class="section-block">
        <div class="section-title">Sharpest objection</div>
        <div class="objection-box">
          <div class="objection-quote">"${p.sharpest_objection.quote}"</div>
          <div class="objection-text">${p.sharpest_objection.objection}</div>
        </div>
      </div>
      <div class="section-block">
        <div class="section-title">Section breakdown</div>
        <div class="breakdown-items">${breakdown}</div>
      </div>
      <div class="section-block">
        <div class="section-title">What would change my mind</div>
        <div class="wtcmm-box">
          <div class="wtcmm-text">${p.what_would_change_my_mind}</div>
        </div>
      </div>
    </div>
  `;
}

function buildNav() {
  const row = document.getElementById('nav-row');
  const isFirst = current === 0;
  const isLast = current === PERSONAS.length - 1;

  row.innerHTML = `
    <button class="nav-btn" onclick="goTo(current - 1)" ${isFirst ? 'disabled' : ''}>
      ← Previous
    </button>
    <div class="nav-counter">${current + 1} of ${PERSONAS.length}</div>
    ${!isLast ? `<button class="nav-btn primary" onclick="goTo(current + 1)">
      Next reviewer →
    </button>` : `<button class="nav-btn primary" onclick="showEnterRoom()">
      All verdicts read →
    </button>`}
  `;
}

function goTo(idx) {
  if (idx < 0 || idx >= PERSONAS.length) return;
  current = idx;
  buildTabs();
  buildVerdict(idx);
  buildNav();
  document.getElementById('enter-room-wrap').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showEnterRoom() {
  document.getElementById('enter-room-wrap').style.display = 'block';
  document.getElementById('enter-room-wrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function enterRoom() {
  // Wire to MeDo: navigate to defence room
  window.parent?.postMessage({ type: 'enterRoom' }, '*');
  alert('→ Entering the room (wire to Screen 3 in MeDo)');
}

// Init
buildTabs();
buildVerdict(0);
buildNav();
</script>
</body>
</html>
